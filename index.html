<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Media App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background: #fff;
      min-height: 100vh;
      position: relative;
      padding-bottom: 60px;
      padding-top: 60px;
    }

    /* Top Navigation Bar */
    .top-bar {
      position: fixed;
      top: 0;
      width: 100%;
      max-width: 480px;
      height: 60px;
      background: #fff;
      border-bottom: 1px solid #dbdbdb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      z-index: 100;
    }

    .top-bar h2 {
      font-size: 20px;
      color: #1877f2;
    }

    .top-bar .icon-btn {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      position: relative;
    }

    /* Bottom Navigation Bar */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 480px;
      height: 60px;
      background: #fff;
      border-top: 1px solid #dbdbdb;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .bottom-bar button {
      background: none;
      border: none;
      font-size: 14px;
      font-weight: bold;
      color: #555;
      cursor: pointer;
    }

    .bottom-bar button.active {
      color: #1877f2;
    }

    /* Feed Container */
    .feed {
      padding: 10px;
    }

    .post {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      margin-bottom: 15px;
      padding: 12px;
    }

    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #ccc;
      object-fit: cover;
    }

    .username {
      font-weight: bold;
      font-size: 14px;
    }

    .btn-subscribe {
      background: #1877f2;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
    }

    .btn-subscribe.subscribed {
      background: #e4e6eb;
      color: #000;
    }

    .post-content {
      font-size: 14px;
      margin-bottom: 10px;
    }

    .post-video {
      width: 100%;
      border-radius: 8px;
      max-height: 350px;
      background: #000;
    }

    .post-actions {
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #f0f0f0;
      padding-top: 8px;
      margin-top: 8px;
    }

    .action-btn {
      background: none;
      border: none;
      color: #616161;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .action-btn.liked {
      color: #e91e63;
    }

    /* Comments Section */
    .comments-section {
      margin-top: 10px;
      border-top: 1px dashed #eee;
      padding-top: 8px;
      display: none;
    }

    .comment-list {
      max-height: 100px;
      overflow-y: auto;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .comment-item {
      margin-bottom: 4px;
    }

    .comment-input-box {
      display: flex;
      gap: 5px;
    }

    .comment-input-box input {
      flex: 1;
      padding: 5px;
      font-size: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .comment-input-box button {
      padding: 5px 10px;
      background: #1877f2;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }

    /* Profile View */
    .profile-view {
      display: none;
      padding: 15px;
    }

    .profile-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .profile-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin-bottom: 10px;
    }

    .subscribers-count {
      color: #1877f2;
      font-weight: bold;
      cursor: pointer;
      margin: 8px 0;
      text-decoration: underline;
    }

    /* Modals / Overlays */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #fff;
      width: 90%;
      max-width: 400px;
      border-radius: 8px;
      padding: 15px;
      max-height: 80vh;
      overflow-y: auto;
      position: relative;
    }

    .close-modal {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 20px;
      cursor: pointer;
    }

    .list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }

    .list-item-left {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    /* Chat View / Modal */
    .chat-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      z-index: 300;
      flex-direction: column;
    }

    .chat-header {
      height: 60px;
      border-bottom: 1px solid #ccc;
      display: flex;
      align-items: center;
      padding: 0 15px;
      gap: 10px;
    }

    .chat-body {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: #f9f9f9;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-message {
      max-width: 70%;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
    }

    .chat-message.sent {
      align-self: flex-end;
      background: #1877f2;
      color: #fff;
    }

    .chat-message.received {
      align-self: flex-start;
      background: #e4e6eb;
      color: #000;
    }

    .chat-media {
      max-width: 100%;
      border-radius: 6px;
      margin-top: 5px;
    }

    .chat-footer {
      padding: 10px;
      border-top: 1px solid #ccc;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chat-footer input[type="text"] {
      flex: 1;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .gallery-btn {
      font-size: 20px;
      cursor: pointer;
    }

    #media-input {
      display: none;
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Top Bar -->
  <div class="top-bar">
    <h2>SocialApp</h2>
    <button class="icon-btn" onclick="openDMList()">💬</button>
  </div>

  <!-- Feed Section -->
  <div id="feed-view" class="feed">
    <!-- Text Post -->
    <div class="post">
      <div class="post-header">
        <div class="user-info" onclick="openProfile('Ali Khan', 'https://via.placeholder.com/40')">
          <img class="avatar" src="https://via.placeholder.com/40" alt="Avatar">
          <span class="username">Ali Khan</span>
        </div>
        <button class="btn-subscribe" onclick="toggleSubscribe(this)">Subscribe</button>
      </div>
      <div class="post-content">
        Aaj ka mausam bohot acha hai! 🌧️ Aap sab kaise hain?
      </div>
      <div class="post-actions">
        <button class="action-btn" onclick="toggleLike(this)">❤️ <span>0</span></button>
        <button class="action-btn" onclick="toggleShare()">↗️ Share</button>
        <button class="action-btn" onclick="toggleComments(this)">💬 Comments</button>
      </div>
      <div class="comments-section">
        <div class="comment-list"></div>
        <div class="comment-input-box">
          <input type="text" placeholder="Write a comment...">
          <button onclick="addComment(this)">Post</button>
        </div>
      </div>
    </div>

    <!-- Video Post -->
    <div class="post">
      <div class="post-header">
        <div class="user-info" onclick="openProfile('Usman Ahmed', 'https://via.placeholder.com/40')">
          <img class="avatar" src="https://via.placeholder.com/40" alt="Avatar">
          <span class="username">Usman Ahmed</span>
        </div>
        <button class="btn-subscribe" onclick="toggleSubscribe(this)">Subscribe</button>
      </div>
      <div class="post-content">
        <video class="post-video" controls src="https://www.w3schools.com/html/mov_bbb.mp4"></video>
      </div>
      <div class="post-actions">
        <button class="action-btn" onclick="toggleLike(this)">❤️ <span>0</span></button>
        <button class="action-btn" onclick="toggleShare()">↗️ Share</button>
        <button class="action-btn" onclick="toggleComments(this)">💬 Comments</button>
      </div>
      <div class="comments-section">
        <div class="comment-list"></div>
        <div class="comment-input-box">
          <input type="text" placeholder="Write a comment...">
          <button onclick="addComment(this)">Post</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Profile View -->
  <div id="profile-view" class="profile-view">
    <div class="profile-header">
      <img id="prof-img" class="profile-avatar" src="https://via.placeholder.com/80" alt="Profile">
      <h3 id="prof-name">User Name</h3>
      <div class="subscribers-count" onclick="openSubscribersList()">Total Subscribers: <span id="sub-count">3</span></div>
    </div>

    <h4>Posts & Videos</h4>
    <div id="profile-posts-container" style="margin-top: 10px;">
      <!-- Profile posts rendered dynamically -->
    </div>
  </div>

  <!-- Bottom Bar -->
  <div class="bottom-bar">
    <button class="active" onclick="switchTab('feed')">Home</button>
    <button onclick="switchTab('profile')">Profile</button>
  </div>
</div>

<!-- Subscribers Modal -->
<div id="subscribers-modal" class="modal">
  <div class="modal-content">
    <span class="close-modal" onclick="closeModal('subscribers-modal')">&times;</span>
    <h3>Subscribers List</h3>
    <div id="subscribers-list" style="margin-top: 15px;">
      <div class="list-item">
        <div class="list-item-left" onclick="visitProfileFromSub('Hamza')">
          <img class="avatar" src="https://via.placeholder.com/40" alt="sub">
          <span>Hamza</span>
        </div>
      </div>
      <div class="list-item">
        <div class="list-item-left" onclick="visitProfileFromSub('Sara')">
          <img class="avatar" src="https://via.placeholder.com/40" alt="sub">
          <span>Sara</span>
        </div>
      </div>
      <div class="list-item">
        <div class="list-item-left" onclick="visitProfileFromSub('Bilal')">
          <img class="avatar" src="https://via.placeholder.com/40" alt="sub">
          <span>Bilal</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- DM List Modal -->
<div id="dm-list-modal" class="modal">
  <div class="modal-content">
    <span class="close-modal" onclick="closeModal('dm-list-modal')">&times;</span>
    <h3>Direct Messages</h3>
    <div style="margin-top: 15px;">
      <div class="list-item" onclick="openChat('Ali Khan', 'https://via.placeholder.com/40')">
        <div class="list-item-left">
          <img class="avatar" src="https://via.placeholder.com/40" alt="user">
          <span>Ali Khan</span>
        </div>
      </div>
      <div class="list-item" onclick="openChat('Usman Ahmed', 'https://via.placeholder.com/40')">
        <div class="list-item-left">
          <img class="avatar" src="https://via.placeholder.com/40" alt="user">
          <span>Usman Ahmed</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Chat Screen -->
<div id="chat-screen" class="chat-modal">
  <div class="chat-header">
    <button onclick="closeChat()" style="background:none; border:none; font-size: 18px; cursor:pointer;">←</button>
    <img id="chat-user-img" class="avatar" src="" alt="user">
    <span id="chat-user-name" style="font-weight:bold;">Name</span>
  </div>
  <div id="chat-body" class="chat-body"></div>
  <div class="chat-footer">
    <label for="media-input" class="gallery-btn">📁</label>
    <input type="file" id="media-input" accept="image/*,video/*" onchange="sendMediaMessage(this)">
    <input type="text" id="chat-text-input" placeholder="Message write karein...">
    <button onclick="sendTextMessage()" style="padding: 8px 12px; background:#1877f2; color:#fff; border:none; border-radius:4px; cursor:pointer;">Send</button>
  </div>
</div>

<script>
  let currentProfileUser = "My Profile";
  let currentProfileImg = "https://via.placeholder.com/80";

  function switchTab(tab) {
    const feedView = document.getElementById('feed-view');
    const profileView = document.getElementById('profile-view');
    const buttons = document.querySelectorAll('.bottom-bar button');

    if (tab === 'feed') {
      feedView.style.display = 'block';
      profileView.style.display = 'none';
      buttons[0].classList.add('active');
      buttons[1].classList.remove('active');
    } else {
      feedView.style.display = 'none';
      profileView.style.display = 'block';
      buttons[1].classList.add('active');
      buttons[0].classList.remove('active');
      renderProfileView(currentProfileUser, currentProfileImg);
    }
  }

  function toggleLike(btn) {
    btn.classList.toggle('liked');
    let span = btn.querySelector('span');
    let count = parseInt(span.innerText);
    if (btn.classList.contains('liked')) {
      span.innerText = count + 1;
    } else {
      span.innerText = count - 1;
    }
  }

  function toggleSubscribe(btn) {
    if (btn.classList.contains('subscribed')) {
      btn.classList.remove('subscribed');
      btn.innerText = 'Subscribe';
    } else {
      btn.classList.add('subscribed');
      btn.innerText = 'Subscribed';
    }
  }

  function toggleShare() {
    if (navigator.share) {
      navigator.share({ title: 'Post', url: window.location.href });
    } else {
      alert('Share link copied to clipboard!');
    }
  }

  function toggleComments(btn) {
    const post = btn.closest('.post');
    const commentsSection = post.querySelector('.comments-section');
    commentsSection.style.display = commentsSection.style.display === 'block' ? 'none' : 'block';
  }

  function addComment(btn) {
    const input = btn.previousElementSibling;
    const commentText = input.value.trim();
    if (commentText) {
      const commentList = btn.closest('.comments-section').querySelector('.comment-list');
      const div = document.createElement('div');
      div.className = 'comment-item';
      div.innerHTML = `<strong>You:</strong> ${commentText}`;
      commentList.appendChild(div);
      input.value = '';
    }
  }

  /* Profile Handlers */
  function openProfile(name, img) {
    currentProfileUser = name;
    currentProfileImg = img;
    switchTab('profile');
  }

  function renderProfileView(name, img) {
    document.getElementById('prof-name').innerText = name;
    document.getElementById('prof-img').src = img;

    const container = document.getElementById('profile-posts-container');
    container.innerHTML = `
      <div class="post">
        <div class="post-header">
          <div class="user-info">
            <img class="avatar" src="${img}" alt="Avatar">
            <span class="username">${name}</span>
          </div>
          <button class="btn-subscribe" onclick="toggleSubscribe(this)">Subscribe</button>
        </div>
        <div class="post-content">
          <video class="post-video" controls src="https://www.w3schools.com/html/mov_bbb.mp4"></video>
        </div>
        <div class="post-actions">
          <button class="action-btn" onclick="toggleLike(this)">❤️ <span>0</span></button>
          <button class="action-btn" onclick="toggleShare()">↗️ Share</button>
          <button class="action-btn" onclick="toggleComments(this)">💬 Comments</button>
        </div>
        <div class="comments-section">
          <div class="comment-list"></div>
          <div class="comment-input-box">
            <input type="text" placeholder="Write a comment...">
            <button onclick="addComment(this)">Post</button>
          </div>
        </div>
      </div>
    `;
  }

  /* Subscribers Modal Functions */
  function openSubscribersList() {
    document.getElementById('subscribers-modal').style.display = 'flex';
  }

  function closeModal(id) {
    document.getElementById(id).style.display = 'none';
  }

  function visitProfileFromSub(userName) {
    closeModal('subscribers-modal');
    openProfile(userName, 'https://via.placeholder.com/40');
  }

  /* DM & Chat Functions */
  function openDMList() {
    document.getElementById('dm-list-modal').style.display = 'flex';
  }

  function openChat(name, img) {
    closeModal('dm-list-modal');
    document.getElementById('chat-user-name').innerText = name;
    document.getElementById('chat-user-img').src = img;
    document.getElementById('chat-body').innerHTML = ''; // Reset chat
    document.getElementById('chat-screen').style.display = 'flex';
  }

  function closeChat() {
    document.getElementById('chat-screen').style.display = 'none';
  }

  function sendTextMessage() {
    const input = document.getElementById('chat-text-input');
    const text = input.value.trim();
    if (text) {
      const chatBody = document.getElementById('chat-body');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'chat-message sent';
      msgDiv.innerText = text;
      chatBody.appendChild(msgDiv);
      input.value = '';
      chatBody.scrollTop = chatBody.scrollHeight;
    }
  }

  function sendMediaMessage(input) {
    const file = input.files[0];
    if (file) {
      const chatBody = document.getElementById('chat-body');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'chat-message sent';

      const fileURL = URL.createObjectURL(file);
      if (file.type.startsWith('image/')) {
        msgDiv.innerHTML = `<img src="${fileURL}" class="chat-media">`;
      } else if (file.type.startsWith('video/')) {
        msgDiv.innerHTML = `<video src="${fileURL}" controls class="chat-media"></video>`;
      }

      chatBody.appendChild(msgDiv);
      input.value = '';
      chatBody.scrollTop = chatBody.scrollHeight;
    }
  }
</script>
</body>
</html>
