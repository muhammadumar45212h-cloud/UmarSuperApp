<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Umar Super App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Mobile Ads SDK (AdMob) -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-app-pub-9780067506108310~3493198071" crossorigin="anonymous"></script>
  <style>
    body { background-color: #090d16; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    .reels-scroll-container {
      height: calc(100vh - 120px);
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }
    .reel-card {
      height: calc(100vh - 120px);
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      background: #000;
    }
    
    #toastNotification {
      transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out;
      transform: translateY(-150%);
      opacity: 0;
    }
    #toastNotification.show {
      transform: translateY(0);
      opacity: 1;
    }
    .action-btn {
      transition: transform 0.1s ease;
    }
    .action-btn:active {
      transform: scale(0.85);
    }
  </style>
</head>
<body class="pb-16 select-none">

  <!-- TOP TOAST NOTIFICATION -->
  <div id="toastNotification" class="fixed top-2 left-4 right-4 z-[100] bg-slate-800/95 border border-blue-500/50 text-white px-4 py-2.5 rounded-xl shadow-2xl flex items-center justify-between text-xs font-semibold backdrop-blur-md">
    <span id="toastMessage">Notification</span>
    <i class="fas fa-bell text-blue-400"></i>
  </div>

  <!-- TOP NAVBAR -->
  <header class="bg-slate-900/90 border-b border-slate-800/80 px-4 py-3 flex justify-between items-center sticky top-0 z-40 backdrop-blur-md">
    <h1 class="text-xl font-black bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">Super App</h1>
    <div class="flex items-center gap-3">
      <div id="weatherWidget" class="bg-slate-800 border border-slate-700/50 text-xs px-3 py-1 rounded-full text-blue-300 flex items-center gap-1.5">
        <i class="fas fa-sun text-amber-400"></i> <span id="weatherText">Karachi 32°C</span>
      </div>
      <button onclick="toggleSettingsModal()" class="text-slate-400 hover:text-white p-1">
        <i class="fas fa-ellipsis-v text-lg"></i>
      </button>
    </div>
  </header>

  <!-- 1. REELS TAB -->
  <section id="tab-reels" class="tab-content active">
    <div id="reelsContainer" class="reels-scroll-container w-full"></div>
  </section>

  <!-- 2. PUBLIC FEED TAB -->
  <section id="tab-feed" class="tab-content p-4 space-y-4">
    <h2 class="text-lg font-bold text-amber-400 flex items-center gap-2"><i class="fas fa-newspaper"></i> Public Feed</h2>
    <div id="feedPosts" class="space-y-4"></div>
  </section>

  <!-- 3. FOREX & CRYPTO TAB -->
  <section id="tab-forex" class="tab-content p-4">
    <h2 class="text-lg font-bold text-emerald-400 mb-3 flex items-center gap-2"><i class="fas fa-chart-line"></i> Live Forex & Crypto Market</h2>
    <div class="flex gap-2 mb-3">
      <button onclick="loadTradingViewChart('FX:XAUUSD')" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-3.5 py-1.5 rounded-lg font-bold shadow">XAUUSD</button>
      <button onclick="loadTradingViewChart('BITSTAMP:BTCUSD')" class="bg-slate-800 text-slate-300 hover:text-white text-xs px-3.5 py-1.5 rounded-lg font-bold border border-slate-700">BTCUSD</button>
      <button onclick="loadTradingViewChart('FX:EURUSD')" class="bg-slate-800 text-slate-300 hover:text-white text-xs px-3.5 py-1.5 rounded-lg font-bold border border-slate-700">EURUSD</button>
    </div>
    <div class="w-full h-[400px] bg-slate-900 rounded-xl overflow-hidden border border-slate-800">
      <div id="tradingview_chart" class="w-full h-full"></div>
    </div>
  </section>

  <!-- 4. OFFLINE VIDEOS PAGE TAB -->
  <section id="tab-offline" class="tab-content p-4">
    <h2 class="text-lg font-bold text-rose-400 mb-3 flex items-center gap-2"><i class="fas fa-download"></i> Saved Offline Videos</h2>
    <div id="offlineVideosList" class="space-y-4"></div>
  </section>

  <!-- 5. PROFILE TAB -->
  <section id="tab-profile" class="tab-content p-4">
    <div class="text-center mb-4">
      <div class="w-20 h-20 bg-gradient-to-tr from-rose-500 to-pink-500 rounded-full mx-auto flex items-center justify-center text-3xl text-white shadow-lg mb-2">
        <i class="fas fa-user-gear"></i>
      </div>
      <h3 class="text-lg font-bold text-white">@umar_developer</h3>
      <p class="text-xs text-slate-400">Platform Owner / Developer</p>
    </div>

    <div class="grid grid-cols-3 gap-2 mb-4 text-center">
      <div class="bg-slate-900 p-3 border border-slate-800 rounded-xl">
        <p class="text-base font-black text-blue-400" id="profileLikes">0</p>
        <p class="text-[10px] text-slate-400">Likes</p>
      </div>
      <div class="bg-slate-900 p-3 border border-slate-800 rounded-xl">
        <p class="text-base font-black text-blue-400" id="profileSubs">1</p>
        <p class="text-[10px] text-slate-400">Subscribers</p>
      </div>
      <div class="bg-slate-900 p-3 border border-slate-800 rounded-xl">
        <p class="text-base font-black text-blue-400" id="profilePostsCount">0</p>
        <p class="text-[10px] text-slate-400">My Posts</p>
      </div>
    </div>

    <h4 class="text-xs font-bold text-slate-300 mb-2 uppercase">My Uploaded Videos & Posts</h4>
    <div id="ownerPostsList" class="space-y-2"></div>
  </section>

  <!-- CREATE MEDIA MODAL -->
  <div id="createModal" class="fixed inset-0 bg-black/80 hidden items-end z-50 backdrop-blur-sm">
    <div class="bg-slate-900 w-full p-4 rounded-t-2xl border-t border-slate-800">
      <div class="flex justify-between items-center mb-3">
        <h3 class="font-bold text-sm text-white">Create New Upload</h3>
        <button onclick="toggleCreateModal()" class="text-slate-400 text-xl">&times;</button>
      </div>
      <select id="postType" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white mb-3">
        <option value="reel">🎬 Reel (Video)</option>
        <option value="feed">📝 Public Feed (Post)</option>
      </select>
      <input type="file" id="mediaInput" accept="video/*,image/*" class="w-full bg-slate-800 text-xs text-slate-300 rounded-xl p-2 mb-3">
      <input type="text" id="captionInput" placeholder="Write caption..." class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white mb-3">
      <button onclick="publishContent()" class="w-full bg-blue-600 text-white font-bold text-xs py-3 rounded-xl shadow-lg">Publish Now</button>
    </div>
  </div>

  <!-- COMMENTS MODAL -->
  <div id="commentModal" class="fixed inset-0 bg-black/80 hidden items-end z-50 backdrop-blur-sm">
    <div class="bg-slate-900 w-full p-4 rounded-t-2xl border-t border-slate-800 max-h-[60vh] flex flex-col justify-between">
      <div class="flex justify-between items-center mb-2">
        <h3 class="font-bold text-xs text-white">Comments</h3>
        <button onclick="toggleCommentModal()" class="text-slate-400 text-lg">&times;</button>
      </div>
      <div id="commentList" class="overflow-y-auto space-y-2 my-2 flex-1 text-xs text-slate-300">
        <p class="text-slate-500 text-center text-[11px]">No comments yet. Be the first!</p>
      </div>
      <div class="flex items-center gap-2 pt-2 border-t border-slate-800">
        <input type="text" id="commentInput" placeholder="Add a comment..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
        <button onclick="addComment()" class="bg-blue-600 text-white px-3 py-2 rounded-xl text-xs font-bold">Post</button>
      </div>
    </div>
  </div>

  <!-- SETTINGS MODAL -->
  <div id="settingsModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50 backdrop-blur-sm">
    <div class="bg-slate-900 w-full max-w-sm p-4 rounded-2xl border border-slate-800">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-sm text-white"><i class="fas fa-sliders text-blue-400"></i> Settings</h3>
        <button onclick="toggleSettingsModal()" class="text-slate-400 text-xl">&times;</button>
      </div>
      <div class="space-y-3 text-xs">
        <button onclick="downloadCurrentVideoOffline()" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 p-3 rounded-xl text-left flex items-center justify-between text-white font-bold">
          <span><i class="fas fa-download text-rose-400 mr-2"></i> Save Active Video Offline</span>
          <i class="fas fa-chevron-right text-slate-500"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 border-t border-slate-800/80 flex justify-around items-center py-2 z-40 backdrop-blur-md">
    <button onclick="switchTab('reels')" id="nav-reels" class="flex flex-col items-center text-rose-500 font-bold">
      <i class="fas fa-film text-lg"></i>
      <span class="text-[9px] mt-0.5">Reels</span>
    </button>
    <button onclick="switchTab('feed')" id="nav-feed" class="flex flex-col items-center text-slate-400">
      <i class="fas fa-newspaper text-lg"></i>
      <span class="text-[9px] mt-0.5">Feed</span>
    </button>
    <button onclick="switchTab('forex')" id="nav-forex" class="flex flex-col items-center text-slate-400">
      <i class="fas fa-chart-line text-lg"></i>
      <span class="text-[9px] mt-0.5">Forex</span>
    </button>
    <button onclick="toggleCreateModal()" class="bg-gradient-to-tr from-pink-600 to-rose-500 text-white w-10 h-10 rounded-full flex items-center justify-center text-lg shadow-lg -mt-3 border-2 border-slate-900">
      <i class="fas fa-plus"></i>
    </button>
    <button onclick="switchTab('offline')" id="nav-offline" class="flex flex-col items-center text-slate-400">
      <i class="fas fa-download text-lg"></i>
      <span class="text-[9px] mt-0.5">Offline</span>
    </button>
    <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center text-slate-400">
      <i class="fas fa-user text-lg"></i>
      <span class="text-[9px] mt-0.5">Profile</span>
    </button>
  </nav>

  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>

  <script>
    const CURRENT_USER = "@umar_developer";
    let activeReelId = 1;
    
    let reelsData = [
      { id: 1, user: "@aqibofficial", video: "https://www.w3schools.com/html/mov_bbb.mp4", caption: "AQIB VIDEO EDITION", likes: 12, comments: [], subscribed: false, liked: false },
      { id: 2, user: "@umar_developer", video: "https://www.w3schools.com/html/movie.mp4", caption: "Super App New Release 🚀", likes: 89, comments: [], subscribed: false, liked: false }
    ];

    let feedData = [
      { id: 101, user: "@umar_developer", text: "Super app optimized with fast speed & clean design!", likes: 45, liked: false }
    ];

    let offlineVideos = [];

    function showToast(msg) {
      const toast = document.getElementById('toastNotification');
      document.getElementById('toastMessage').innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tabName).classList.add('active');
      
      const tabs = ['reels', 'feed', 'forex', 'offline', 'profile'];
      tabs.forEach(t => {
        const btn = document.getElementById('nav-' + t);
        if(btn) btn.className = `flex flex-col items-center ${t === tabName ? 'text-rose-500 font-bold' : 'text-slate-400'}`;
      });

      if (tabName === 'forex') loadTradingViewChart('FX:XAUUSD');
      if (tabName === 'profile') updateProfileStats();
      if (tabName === 'offline') renderOfflineVideos();
    }

    function toggleCreateModal() { document.getElementById('createModal').classList.toggle('hidden'); }
    function toggleSettingsModal() { document.getElementById('settingsModal').classList.toggle('hidden'); }
    function toggleCommentModal(id = null) {
      if(id) activeReelId = id;
      const modal = document.getElementById('commentModal');
      modal.classList.toggle('hidden');
      modal.classList.toggle('flex');
    }

    // Render Reels with Complete Interactions
    function renderReels() {
      const container = document.getElementById('reelsContainer');
      container.innerHTML = reelsData.map(reel => `
        <div class="reel-card flex items-center justify-center relative">
          <video id="video-${reel.id}" src="${reel.video}" class="w-full h-full object-cover" loop autoplay playsinline></video>
          
          <!-- Sound Toggle Button -->
          <button onclick="toggleAudio(${reel.id})" class="absolute top-4 right-4 z-20 bg-black/50 text-white w-8 h-8 rounded-full flex items-center justify-center text-xs backdrop-blur-md">
            <i id="audio-icon-${reel.id}" class="fas fa-volume-up"></i>
          </button>

          <!-- User Profile & Caption Info -->
          <div class="absolute bottom-6 left-4 right-20 z-10 text-white space-y-1">
            <div class="flex items-center gap-2">
              <span onclick="openUserProfile('${reel.user}')" class="font-bold text-sm drop-shadow cursor-pointer hover:underline">${reel.user}</span>
              <button onclick="toggleSubscribe(${reel.id})" class="bg-rose-600 text-white text-[10px] px-2 py-0.5 rounded-full font-bold">
                ${reel.subscribed ? 'Subscribed' : 'Subscribe'}
              </button>
            </div>
            <p class="text-xs drop-shadow text-slate-200">${reel.caption}</p>
          </div>

          <!-- TikTok Style Right Sidebar Actions -->
          <div class="absolute right-3 bottom-12 flex flex-col items-center gap-5 z-20">
            <!-- Like -->
            <button onclick="toggleLike(${reel.id}, 'reel')" class="action-btn flex flex-col items-center text-white">
              <div class="w-10 h-10 rounded-full bg-slate-900/60 backdrop-blur-md flex items-center justify-center text-lg ${reel.liked ? 'text-rose-500' : 'text-white'}">
                <i class="fas fa-heart"></i>
              </div>
              <span id="like-count-${reel.id}" class="text-[10px] font-bold mt-1 drop-shadow">${reel.likes}</span>
            </button>

            <!-- Comment -->
            <button onclick="toggleCommentModal(${reel.id})" class="action-btn flex flex-col items-center text-white">
              <div class="w-10 h-10 rounded-full bg-slate-900/60 backdrop-blur-md flex items-center justify-center text-lg">
                <i class="fas fa-comment-dots"></i>
              </div>
              <span class="text-[10px] font-bold mt-1 drop-shadow">${reel.comments.length}</span>
            </button>

            <!-- Share -->
            <button onclick="shareVideo('${reel.caption}')" class="action-btn flex flex-col items-center text-white">
              <div class="w-10 h-10 rounded-full bg-slate-900/60 backdrop-blur-md flex items-center justify-center text-lg">
                <i class="fas fa-share"></i>
              </div>
              <span class="text-[10px] font-bold mt-1 drop-shadow">Share</span>
            </button>

            <!-- Download -->
            <button onclick="saveOfflineDirect(${reel.id})" class="action-btn flex flex-col items-center text-white">
              <div class="w-10 h-10 rounded-full bg-slate-900/60 backdrop-blur-md flex items-center justify-center text-lg text-emerald-400">
                <i class="fas fa-download"></i>
              </div>
              <span class="text-[10px] font-bold mt-1 drop-shadow">Save</span>
            </button>
          </div>
        </div>
      `).join('');
    }

    function toggleAudio(id) {
      const vid = document.getElementById(`video-${id}`);
      const icon = document.getElementById(`audio-icon-${id}`);
      if (vid) {
        vid.muted = !vid.muted;
        icon.className = vid.muted ? "fas fa-volume-mute" : "fas fa-volume-up";
      }
    }

    function toggleLike(id, type) {
      if(type === 'reel') {
        const item = reelsData.find(r => r.id === id);
        if(item) {
          item.liked = !item.liked;
          item.likes += item.liked ? 1 : -1;
          
          // Smooth count update without screen flicker
          const countEl = document.getElementById(`like-count-${id}`);
          if(countEl) countEl.innerText = item.likes;
          
          const iconEl = countEl.previousElementSibling;
          if(iconEl) {
            iconEl.className = `w-10 h-10 rounded-full bg-slate-900/60 backdrop-blur-md flex items-center justify-center text-lg ${item.liked ? 'text-rose-500' : 'text-white'}`;
          }
        }
      }
      updateProfileStats();
    }

    function toggleSubscribe(id) {
      const reel = reelsData.find(r => r.id === id);
      if(reel) {
        reel.subscribed = !reel.subscribed;
        renderReels();
        showToast(reel.subscribed ? `Subscribed to ${reel.user}` : "Unsubscribed");
      }
    }

    function openUserProfile(username) {
      switchTab('profile');
      showToast(`Viewing ${username}'s profile`);
    }

    function shareVideo(caption) {
      if (navigator.share) {
        navigator.share({ title: 'Super App Reel', text: caption, url: window.location.href });
      } else {
        showToast("Link copied to clipboard!");
      }
    }

    function saveOfflineDirect(id) {
      const video = reelsData.find(r => r.id === id);
      if(video && !offlineVideos.some(v => v.id === id)) {
        offlineVideos.push(video);
        showToast("Saved to Offline Videos!");
      } else {
        showToast("Already saved offline!");
      }
    }

    function downloadCurrentVideoOffline() {
      if(reelsData.length > 0) {
        saveOfflineDirect(reelsData[0].id);
        toggleSettingsModal();
      }
    }

    function deleteMyPost(id, type) {
      if(type === 'reel') {
        reelsData = reelsData.filter(r => r.id !== id);
        renderReels();
      } else {
        feedData = feedData.filter(f => f.id !== id);
        renderFeed();
      }
      updateProfileStats();
      showToast("Post deleted!");
    }

    function updateProfileStats() {
      let totalLikes = reelsData.reduce((acc, r) => acc + r.likes, 0) + feedData.reduce((acc, f) => acc + f.likes, 0);
      let myPosts = [...reelsData.filter(r => r.user === CURRENT_USER), ...feedData.filter(f => f.user === CURRENT_USER)];
      
      document.getElementById('profileLikes').innerText = totalLikes;
      document.getElementById('profilePostsCount').innerText = myPosts.length;

      const ownerList = document.getElementById('ownerPostsList');
      if(myPosts.length === 0) {
        ownerList.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">No uploads yet.</p>`;
        return;
      }

      ownerList.innerHTML = myPosts.map(p => `
        <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 text-xs text-slate-300 flex justify-between items-center">
          <div class="truncate max-w-[200px]">
            <p class="font-bold text-white">${p.caption || p.text}</p>
            <span class="text-[10px] text-blue-400">${p.likes} Likes</span>
          </div>
          <button onclick="deleteMyPost(${p.id}, '${p.video ? 'reel' : 'feed'}')" class="text-rose-500 bg-rose-500/10 px-2.5 py-1.5 rounded-lg text-xs font-bold">
            <i class="fas fa-trash"></i> Delete
          </button>
        </div>
      `).join('');
    }

    function publishContent() {
      const type = document.getElementById('postType').value;
      const caption = document.getElementById('captionInput').value.trim();
      const fileInput = document.getElementById('mediaInput');

      let mediaUrl = "https://www.w3schools.com/html/mov_bbb.mp4";
      if(fileInput.files.length > 0) {
        mediaUrl = URL.createObjectURL(fileInput.files[0]);
      }

      if(type === 'reel') {
        reelsData.unshift({ id: Date.now(), user: CURRENT_USER, video: mediaUrl, caption: caption || "New Reel", likes: 0, comments: [], subscribed: false, liked: false });
        renderReels();
        switchTab('reels');
      } else {
        feedData.unshift({ id: Date.now(), user: CURRENT_USER, text: caption || "New Post", likes: 0, liked: false });
        renderFeed();
        switchTab('feed');
      }

      toggleCreateModal();
      showToast("Published successfully!");
      document.getElementById('captionInput').value = "";
      fileInput.value = "";
    }

    function renderFeed() {
      const container = document.getElementById('feedPosts');
      container.innerHTML = feedData.map(post => `
        <div class="bg-slate-900 border border-slate-800 p-3.5 rounded-xl space-y-2">
          <div class="flex items-center justify-between">
            <span onclick="openUserProfile('${post.user}')" class="text-xs font-bold text-blue-400 cursor-pointer">${post.user}</span>
            <span class="text-[10px] text-slate-500">Just now</span>
          </div>
          <p class="text-xs text-slate-200">${post.text}</p>
        </div>
      `).join('');
    }

    function renderOfflineVideos() {
      const container = document.getElementById('offlineVideosList');
      if(offlineVideos.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-500 text-center py-6">No offline videos saved yet.</p>`;
        return;
      }
      container.innerHTML = offlineVideos.map(v => `
        <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl flex items-center justify-between">
          <div class="flex items-center gap-3">
            <video src="${v.video}" class="w-12 h-12 rounded-lg object-cover"></video>
            <div>
              <h4 class="text-xs font-bold text-white">${v.caption}</h4>
              <span class="text-[10px] text-slate-400">${v.user}</span>
            </div>
          </div>
          <span class="text-[10px] text-emerald-400 font-bold bg-emerald-400/10 px-2 py-1 rounded-md">Saved</span>
        </div>
      `).join('');
    }

    function loadTradingViewChart(symbol) {
      document.getElementById('tradingview_chart').innerHTML = "";
      new TradingView.widget({
        "autosize": true,
        "symbol": symbol,
        "interval": "D",
        "theme": "dark",
        "container_id": "tradingview_chart"
      });
    }

    window.onload = function() {
      renderReels();
      renderFeed();
    };
  </script>
</body>
</html>
