<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umar Super App System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0f0f12; color: #fff; text-align: center; }
        .hidden { display: none !important; }
        
        /* Auth Screen */
        #auth-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; }
        input { padding: 12px; margin: 8px; border-radius: 6px; border: 1px solid #333; background: #1a1a24; color: #fff; width: 280px; }
        button { padding: 12px 24px; margin-top: 10px; background: #007bff; border: none; color: #fff; border-radius: 6px; cursor: pointer; font-weight: bold; }

        /* Main Container */
        #app-container { display: flex; flex-direction: column; height: 100vh; }
        nav { background: #181824; display: flex; justify-content: space-around; padding: 15px; }
        nav button { margin: 0; background: transparent; border: 1px solid #007bff; }

        /* App Sections */
        .module { flex: 1; overflow-y: auto; padding: 20px; }
        
        /* Video Feed Module */
        .video-card { background: #1f1f2e; margin: 15px auto; padding: 15px; border-radius: 10px; max-width: 400px; text-align: left; }
        video { width: 100%; border-radius: 8px; }
        .actions { display: flex; justify-content: space-between; margin-top: 10px; }

        /* Builder Module */
        .builder-box { background: #1f1f2e; padding: 20px; border-radius: 8px; max-width: 500px; margin: 0 auto; }
    </style>
</head>
<body>

    <!-- Lock Screen / Mandatory Authentication -->
    <div id="auth-screen">
        <h2>Umar Engine Account</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <div>
            <button onclick="login()">Login</button>
            <button onclick="register()" style="background:#28a745">Sign Up</button>
        </div>
    </div>

    <!-- Main Dynamic Application Engine -->
    <div id="app-container" class="hidden">
        <nav>
            <button onclick="showModule('video-feed')">Video Feed</button>
            <button onclick="showModule('developer-app')">Dev & Go Builder</button>
            <button onclick="showModule('game-app')">Game Module</button>
            <button onclick="showModule('dm-app')">Direct Messages</button>
        </nav>

        <!-- Module 1: Video App -->
        <div id="video-feed" class="module">
            <h3>Short Video Stream</h3>
            <div id="video-list"></div>
        </div>

        <!-- Module 2: Dev App + Upload Engine -->
        <div id="developer-app" class="module hidden">
            <div class="builder-box">
                <h3>Go Build & Direct Social Upload</h3>
                <input type="text" id="video-title" placeholder="Video Title">
                <input type="file" id="video-file" accept="video/*">
                <button onclick="uploadVideo()">Upload to Social App</button>
                <hr style="margin:20px 0; border-color:#333;">
                <button onclick="triggerGoBuild()" style="background:#6f42c1">Trigger Go Binary Compiler</button>
                <p id="build-status" style="margin-top:10px; color:#ffc107;"></p>
            </div>
        </div>

        <!-- Module 3: Integrated Game Module -->
        <div id="game-app" class="module hidden">
            <h3>Game Portal Integration</h3>
            <p style="margin-top:20px;">Game Runtime Engine Loaded Contextually.</p>
        </div>

        <!-- Module 4: Direct Messaging -->
        <div id="dm-app" class="module hidden">
            <h3>Realtime Chat / DM</h3>
            <input type="text" id="dm-target" placeholder="Recipient Username">
            <input type="text" id="dm-text" placeholder="Message">
            <button onclick="sendDM()">Send DM</button>
            <div id="dm-log" style="margin-top:20px; text-align:left;"></div>
        </div>
    </div>

    <script>
        let token = "";
        let currentUser = "";
        let ws;

        async function register() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p})
            });
            if(res.ok) alert("User Registered! Please Login.");
            else alert("Registration Failed");
        }

        async function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p})
            });
            
            if(res.ok) {
                const data = await res.json();
                token = data.token;
                currentUser = data.username;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                initWS();
                loadVideos();
            } else {
                alert("Invalid Credentials");
            }
        }

        function showModule(id) {
            document.querySelectorAll('.module').forEach(m => m.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        async function loadVideos() {
            const res = await fetch('/api/videos', {
                headers: {'Authorization': 'Bearer ' + token}
            });
            const data = await res.json();
            const list = document.getElementById('video-list');
            list.innerHTML = "";
            
            data.forEach(v => {
                list.innerHTML += `
                    <div class="video-card">
                        <h4>${v.title}</h4>
                        <video src="${v.url}" controls></video>
                        <div class="actions">
                            <button onclick="likeVideo('${v.id}')">❤️ ${v.likes}</button>
                            <button onclick="commentPrompt('${v.id}')">💬 Comment</button>
                            <button onclick="shareVideo('${v.id}')">🔗 Share</button>
                        </div>
                    </div>
                `;
            });
        }

        async function uploadVideo() {
            const title = document.getElementById('video-title').value;
            const file = document.getElementById('video-file').files[0];
            const formData = new FormData();
            formData.append('title', title);
            formData.append('video', file);

            const res = await fetch('/api/upload-video', {
                method: 'POST',
                headers: {'Authorization': 'Bearer ' + token},
                body: formData
            });

            if(res.ok) {
                alert("Video Successfully Uploaded!");
                showModule('video-feed');
                loadVideos();
            }
        }

        async function triggerGoBuild() {
            document.getElementById('build-status').innerText = "Running 'go build'...";
            const res = await fetch('/api/build', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({app_name: "custom_app", type: "developer_tool"})
            });
            const data = await res.json();
            document.getElementById('build-status').innerText = data.msg;
        }

        async function likeVideo(id) {
            await fetch(`/api/videos/${id}/like`, {
                method: 'POST',
                headers: {'Authorization': 'Bearer ' + token}
            });
            loadVideos();
        }

        function shareVideo(id) {
            navigator.clipboard.writeText(window.location.origin + "/uploads/" + id);
            alert("Share Link Copied!");
        }

        function initWS() {
            ws = new WebSocket(`ws://${location.host}/ws/dm?user_id=${currentUser}`);
            ws.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                const log = document.getElementById('dm-log');
                log.innerHTML += `<p><b>${msg.sender}:</b> ${msg.message}</p>`;
            };
        }

        function sendDM() {
            const target = document.getElementById('dm-target').value;
            const txt = document.getElementById('dm-text').value;
            ws.send(JSON.stringify({
                sender: currentUser,
                receiver: target,
                message: txt
            }));
            const log = document.getElementById('dm-log');
            log.innerHTML += `<p style="color:#888;"><b>Me -> ${target}:</b> ${txt}</p>`;
        }
    </script>
</body>
</html>
