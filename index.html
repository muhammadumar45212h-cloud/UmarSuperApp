<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Super App</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Skulpt Engine for Python Execution -->
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>

  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #111827;
      --accent-blue: #00f2fe;
      --accent-red: #ff0055;
    }
    body {
      background-color: var(--bg-dark);
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .allow-select {
      user-select: text !important;
      -webkit-user-select: text !important;
    }
    .fullscreen-modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      background-color: var(--bg-dark);
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
    }
    .btn-gradient {
      background: linear-gradient(135deg, #0088cc, #ff0055);
    }
    .reel-container {
      scroll-snap-type: y mandatory;
      overflow-y: scroll;
    }
    .reel-item {
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    #toast-notification {
      transition: all 0.3s ease-in-out;
      transform: translateY(-100%);
      opacity: 0;
    }
    #toast-notification.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body class="h-screen flex flex-col justify-between overflow-hidden">

  <!-- AUTO-DISMISS FLOATING TOAST -->
  <div id="toast-notification" class="fixed top-3 left-1/2 -translate-x-1/2 z-50 bg-gray-800 text-cyan-400 border border-cyan-500/40 px-4 py-2 rounded-full text-xs font-semibold shadow-2xl flex items-center gap-2 pointer-events-none">
    <i class="fa-solid fa-circle-info" id="toast-icon"></i>
    <span id="toast-message">Notification Message</span>
  </div>

  <!-- COMPACT TOP HEADER -->
  <header class="p-2.5 bg-gray-900 border-b border-gray-800 flex justify-between items-center z-10">
    <h1 class="text-base font-extrabold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-blue-500 to-red-500">
      SUPER APP
    </h1>
    <div class="flex gap-1.5 items-center">
      <button onclick="openModal('translateModal')" class="px-2 py-1 bg-gray-800 hover:bg-gray-700 text-[11px] rounded-full border border-green-500/30 text-green-400 flex items-center gap-1">
        <i class="fa-solid fa-language text-[10px]"></i> Translate
      </button>
      <button onclick="openModal('weatherModal')" class="px-2 py-1 bg-gray-800 hover:bg-gray-700 text-[11px] rounded-full border border-cyan-500/30 flex items-center gap-1">
        ☀️ Weather
      </button>
      <button onclick="openModal('chatModal')" class="px-2 py-1 bg-gray-800 hover:bg-gray-700 text-[11px] rounded-full border border-red-500/30 flex items-center gap-1">
        💬 DMs
      </button>
      <button onclick="openModal('codeModal')" class="w-7 h-7 bg-gray-800 hover:bg-gray-700 text-xs rounded-full text-cyan-400 flex items-center justify-center border border-cyan-500/30" title="Code Runner">
        <i class="fa-solid fa-code"></i>
      </button>
    </div>
  </header>

  <!-- MAIN VIEWPORT -->
  <main id="app-viewport" class="flex-1 relative overflow-y-auto no-scrollbar">

    <!-- VIDEOS FEED -->
    <section id="tab-videos" class="h-full w-full bg-black relative flex flex-col">
      <div id="video-feed-container" class="w-full h-full reel-container no-scrollbar overflow-y-scroll">
        <!-- Dynamic Videos -->
      </div>
    </section>

    <!-- TEXT FEED -->
    <section id="tab-feed" class="p-4 space-y-4 hidden">
      <div id="posts-container" class="space-y-4 max-w-md mx-auto">
        <!-- Text Posts Dynamic -->
      </div>
    </section>

    <!-- TRADING CHART -->
    <section id="tab-trading" class="h-full w-full hidden flex-col">
      <div class="p-2 bg-gray-900 text-xs text-cyan-400 font-semibold border-b border-gray-800 flex justify-between items-center">
        <span>📈 Live Market Real-time Chart</span>
        <div class="flex gap-1">
          <button onclick="changeSymbol('FX:XAUUSD')" class="px-2 py-1 bg-gray-800 rounded text-amber-400 text-[10px] font-bold">XAUUSD</button>
          <button onclick="changeSymbol('BITSTAMP:BTCUSD')" class="px-2 py-1 bg-gray-800 rounded text-orange-400 text-[10px] font-bold">BTCUSD</button>
          <button onclick="changeSymbol('FX:EURUSD')" class="px-2 py-1 bg-gray-800 rounded text-cyan-400 text-[10px] font-bold">EURUSD</button>
        </div>
      </div>
      <div class="flex-1 w-full h-full">
        <iframe id="trading-frame" src="https://s.tradingview.com/widgetembed/?frameElementId=tradingview_1&symbol=FX%3AXAUUSD&interval=D&theme=dark" class="w-full h-full border-0"></iframe>
      </div>
    </section>

    <!-- USER PROFILE & SETTINGS -->
    <section id="tab-profile" class="p-4 hidden space-y-5">
      <div class="flex flex-col items-center">
        <div class="w-20 h-20 rounded-full bg-gradient-to-tr from-cyan-500 to-red-500 p-1 mb-2">
          <img id="user-avatar-img" src="https://via.placeholder.com/150/090d16/00f2fe?text=Umar" class="w-full h-full rounded-full object-cover">
        </div>
        <h2 class="text-lg font-bold" id="profile-display-name">@Umar</h2>
        <p class="text-[11px] text-gray-400">Verified Creator Profile</p>
        
        <div class="flex gap-6 mt-3 text-center">
          <div><p class="font-bold text-base" id="profile-likes">0</p><p class="text-[10px] text-gray-400">Likes</p></div>
          <div><p class="font-bold text-base" id="profile-subscribers">1</p><p class="text-[10px] text-gray-400">Subscribers</p></div>
          <div><p class="font-bold text-base" id="profile-posts-count">0</p><p class="text-[10px] text-gray-400">Total Posts</p></div>
        </div>
      </div>

      <!-- WALLET & SETTINGS SECTION -->
      <div class="bg-gray-900 border border-gray-800 rounded-xl p-3 space-y-2">
        <div class="flex justify-between items-center border-b border-gray-800 pb-2">
          <span class="text-xs text-gray-300 font-semibold"><i class="fa-solid fa-wallet text-cyan-400 mr-1"></i> Wallet Balance</span>
          <span class="text-sm font-bold text-green-400">$0.00</span>
        </div>
        <button onclick="triggerWalletWithdraw()" class="w-full py-1.5 bg-gray-800 hover:bg-gray-700 text-cyan-400 rounded text-xs font-bold border border-cyan-500/30">
          Withdraw / Transfer Funds
        </button>
      </div>

      <div class="border-t border-gray-800 pt-3">
        <h3 class="text-xs font-semibold mb-3 text-cyan-400">My Uploads & Videos</h3>
        <div id="profile-grid" class="grid grid-cols-3 gap-2"></div>
      </div>
    </section>

  </main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="bg-gray-900 border-t border-gray-800 p-2 flex justify-around items-center z-10">
    <button onclick="switchTab('videos')" class="nav-btn text-cyan-400 flex flex-col items-center text-xs">
      <i class="fa-solid fa-play text-base mb-0.5"></i>Videos
    </button>
    <button onclick="switchTab('feed')" class="nav-btn text-gray-400 flex flex-col items-center text-xs">
      <i class="fa-solid fa-newspaper text-base mb-0.5"></i>Feed
    </button>
    <button onclick="openModal('createModal')" class="w-11 h-11 btn-gradient rounded-full flex items-center justify-center text-white text-lg shadow-lg transform -translate-y-2 border-2 border-gray-900">
      <i class="fa-solid fa-plus"></i>
    </button>
    <button onclick="switchTab('trading')" class="nav-btn text-gray-400 flex flex-col items-center text-xs">
      <i class="fa-solid fa-chart-line text-base mb-0.5"></i>Trading
    </button>
    <button onclick="switchTab('profile')" class="nav-btn text-gray-400 flex flex-col items-center text-xs">
      <i class="fa-solid fa-user text-base mb-0.5"></i>Profile
    </button>
  </nav>

  <!-- CREATE POST MODAL -->
  <div id="createModal" class="fullscreen-modal hidden p-4">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-base font-bold text-cyan-400">Create New Post</h2>
      <button onclick="closeModal('createModal')" class="text-gray-400 text-xl"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="space-y-4">
      <div>
        <label class="text-xs text-gray-400 block mb-1">Post Type</label>
        <select id="post-type" onchange="togglePostType()" class="w-full bg-gray-800 border border-gray-700 p-2 rounded text-xs text-white">
          <option value="text">Text Post</option>
          <option value="video">Gallery Video</option>
        </select>
      </div>

      <div id="video-file-field" class="hidden">
        <label class="text-xs text-gray-400 block mb-1">Select Video from Gallery</label>
        <input type="file" id="post-video-file" accept="video/*" class="w-full bg-gray-800 border border-gray-700 p-2 rounded text-xs text-cyan-400">
      </div>

      <div>
        <label class="text-xs text-gray-400 block mb-1">Caption / Content</label>
        <textarea id="post-caption" class="w-full h-24 bg-gray-800 border border-gray-700 p-3 rounded text-xs text-white focus:outline-none allow-select" placeholder="Write something..."></textarea>
      </div>

      <button onclick="publishPost()" class="w-full py-2.5 btn-gradient rounded text-xs font-bold text-white shadow-lg">Publish Post</button>
    </div>
  </div>

  <!-- SCRIPT INTEGRATION -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB9ACAxelcW-esJWUDrD5lhL_7svxlyGxc",
      authDomain: "umarsuperapp.firebaseapp.com",
      projectId: "umarsuperapp",
      storageBucket: "umarsuperapp.firebasestorage.app",
      messagingSenderId: "812034119197",
      appId: "1:812034119197:web:60dc07304f30f29f6058f4"
    };

    const app = initializeApp(firebaseConfig);
    window.SUPABASE_URL = "https://hfrqoamagezzgdomlmus.supabase.co";
    window.SUPABASE_KEY = "sb_publishable_qWJP0WEFBfRKwcbxRcoQCA_bmkpmJyN";
  </script>

  <script>
    // GLOBAL STATE & POSTS
    let posts = [
      { id: 1, type: 'text', author: '@Umar', content: 'Wellcume to Super App!', likes: 1, isLiked: false, subscribers: 1, comments: [] }
    ];

    function showToast(msg) {
      const toast = document.getElementById('toast-notification');
      document.getElementById('toast-message').innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function switchTab(tab) {
      ['videos', 'feed', 'trading', 'profile'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
      });
      document.getElementById(`tab-${tab}`).classList.remove('hidden');
      if (tab === 'profile') renderProfile();
    }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    function togglePostType() {
      const type = document.getElementById('post-type').value;
      document.getElementById('video-file-field').classList.toggle('hidden', type !== 'video');
    }

    function publishPost() {
      const type = document.getElementById('post-type').value;
      const caption = document.getElementById('post-caption').value;
      const videoInput = document.getElementById('post-video-file');

      let newPost = {
        id: Date.now(),
        type: type,
        author: '@Umar',
        content: caption,
        likes: 0,
        isLiked: false,
        subscribers: 1,
        comments: []
      };

      if (type === 'video') {
        if (!videoInput.files || !videoInput.files[0]) {
          showToast('Please select a video file!');
          return;
        }
        newPost.videoUrl = URL.createObjectURL(videoInput.files[0]);
      }

      posts.unshift(newPost);
      closeModal('createModal');
      document.getElementById('post-caption').value = '';
      showToast('Post Published Successfully!');
      renderPosts();
      renderProfile();
    }

    function toggleLike(postId) {
      const p = posts.find(item => item.id === postId);
      if (p) {
        if (p.isLiked) {
          p.likes -= 1;
          p.isLiked = false;
          showToast('Like Removed');
        } else {
          p.likes += 1;
          p.isLiked = true;
          showToast('Post Liked!');
        }
        renderPosts();
        renderProfile();
      }
    }

    function triggerWalletWithdraw() {
      showToast('Balance unavailable ($0.00)');
    }

    function renderPosts() {
      const container = document.getElementById('posts-container');
      const videoContainer = document.getElementById('video-feed-container');
      container.innerHTML = '';
      videoContainer.innerHTML = '';

      posts.forEach(p => {
        if (p.type === 'text') {
          container.innerHTML += `
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-3 space-y-2">
              <div class="flex justify-between items-center">
                <div class="flex items-center gap-2">
                  <div class="w-7 h-7 rounded-full bg-cyan-500 flex items-center justify-center font-bold text-xs text-black">U</div>
                  <span class="text-xs font-bold">${p.author}</span>
                  <button class="text-[10px] text-cyan-400 hover:underline">+ Subscribe</button>
                </div>
                <button class="text-gray-400 text-xs px-2"><i class="fa-solid fa-ellipsis-vertical"></i></button>
              </div>
              <p class="text-xs text-gray-200 allow-select">${p.content}</p>
              <div class="flex justify-between items-center pt-2 border-t border-gray-800 text-xs">
                <button onclick="toggleLike(${p.id})" class="${p.isLiked ? 'text-red-500' : 'text-gray-400'} flex items-center gap-1 font-semibold">
                  <i class="fa-solid fa-heart"></i> ${p.likes}
                </button>
                <button class="text-gray-400 flex items-center gap-1"><i class="fa-regular fa-comment"></i> Comment</button>
                <button class="text-gray-400 flex items-center gap-1"><i class="fa-solid fa-share"></i> Share</button>
                <button onclick="openModal('chatModal')" class="text-cyan-400 flex items-center gap-1 font-bold"><i class="fa-paper-plane"></i> DM</button>
              </div>
            </div>
          `;
        } else if (p.type === 'video') {
          videoContainer.innerHTML += `
            <div class="reel-item h-full w-full relative bg-black flex items-center justify-center">
              <video src="${p.videoUrl}" class="w-full h-full object-cover" controls loop autoplay muted></video>
              <div class="absolute bottom-6 left-4 right-16 text-white space-y-1">
                <div class="flex items-center gap-2">
                  <span class="font-bold text-xs">${p.author}</span>
                  <button class="bg-red-600 text-[10px] px-2 py-0.5 rounded-full font-bold">+ Subscribe</button>
                </div>
                <p class="text-xs font-light">${p.content}</p>
              </div>
              <div class="absolute right-3 bottom-12 flex flex-col items-center gap-4 text-white text-xs">
                <button onclick="toggleLike(${p.id})" class="flex flex-col items-center">
                  <i class="fa-solid fa-heart text-xl ${p.isLiked ? 'text-red-500' : 'text-white'}"></i>
                  <span>${p.likes}</span>
                </button>
                <button class="flex flex-col items-center"><i class="fa-solid fa-comment text-xl"></i><span>0</span></button>
                <button class="flex flex-col items-center"><i class="fa-solid fa-share text-xl"></i><span>Share</span></button>
                <button onclick="openModal('chatModal')" class="flex flex-col items-center text-cyan-400"><i class="fa-solid fa-paper-plane text-xl"></i><span>DM</span></button>
              </div>
            </div>
          `;
        }
      });
    }

    function renderProfile() {
      const totalPosts = posts.length;
      const totalLikes = posts.reduce((acc, p) => acc + p.likes, 0);

      document.getElementById('profile-posts-count').innerText = totalPosts;
      document.getElementById('profile-likes').innerText = totalLikes;

      const grid = document.getElementById('profile-grid');
      grid.innerHTML = '';
      posts.forEach(p => {
        if (p.type === 'video') {
          grid.innerHTML += `
            <div class="aspect-square bg-gray-900 border border-gray-800 rounded relative overflow-hidden">
              <video src="${p.videoUrl}" class="w-full h-full object-cover"></video>
              <span class="absolute bottom-1 right-1 text-[9px] bg-black/70 px-1 rounded text-cyan-400 font-bold"><i class="fa-solid fa-heart text-red-500"></i> ${p.likes}</span>
            </div>
          `;
        } else {
          grid.innerHTML += `
            <div class="aspect-square bg-gray-900 border border-gray-800 rounded p-1 flex items-center justify-center text-[10px] text-gray-400 text-center overflow-hidden">
              ${p.content.substring(0, 20)}...
            </div>
          `;
        }
      });
    }

    function changeSymbol(symbol) {
      document.getElementById('trading-frame').src = `https://s.tradingview.com/widgetembed/?frameElementId=tradingview_1&symbol=${encodeURIComponent(symbol)}&interval=D&theme=dark`;
    }

    window.onload = function() {
      renderPosts();
    };
  </script>
</body>
</html>
